apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  destination:
    name: ''
    namespace: longhorn-system
    server: 'https://kubernetes.default.svc'
  source:
    path: ''
    repoURL: 'https://charts.longhorn.io'
    targetRevision: v1.9.2
    chart: longhorn
    helm:
      valueFiles: []
      values: |
        ingress:
          host: longhorn.andrewsutliff.com
          enabled: true
          ingressClassName: private-nginx
        preUpgradeChecker:
          jobEnabled: false
        defaultSettings:
          # Talos nodes only reserve 1024 x 2Mi = 2Gi of
          # hugepages for this (Terraform/Proxmox/node-config/{controlplane,worker}.yaml,
          # machine.sysctls.vm.nr_hugepages) - whatever this gets set to must
          # not exceed that reservation, or instance-manager-v2 pods will fail
          # to get hugepage memory.
          v2DataEngine: true
          v2DataEngineHugepageLimit: 2Gi
          storageNetwork: "longhorn-system/storage-network"
          concurrentReplicaRebuildPerNodeLimit: 3
          concurrentVolumeBackupRestorePerNodeLimit: 2
          defaultDataLocality: best-effort
          replicaAutoBalance: least-effort
          backupTarget: "nfs://172.31.0.15//mnt/Main/kubernetes/backup"
          orphanAutoDeletion: "true"
          autoDeletePodWhenVolumeDetachedUnexpectedly: true
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          nodeDrainPolicy: allways-allow
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
