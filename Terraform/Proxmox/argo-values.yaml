global:
  domain: argo.andrewsutliff.com

configs:
  params:
    server.insecure: "true"
server:
 #extraArgs:
 #  - --auth-mode=server
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: private-nginx
    hostname: argo.andrewsutliff.com
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-issuer
    tls: true
