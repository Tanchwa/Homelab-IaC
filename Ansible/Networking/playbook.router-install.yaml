
#at the end of this play, the router should

#have opnsense installed with 
#  items for PXE
#    PXE server installed
#    DHCP server installed
#    http server installed
#  items for tailscale
#    tailscale
#    advertise local routes over tailscale with correct CIDRS
#    act as an exit node
#    set default routes for local and remote LANs
#  items for firewall
#    port forwarding to the correct k8s load balancer ingresses
#
#IDS to be determined
# use -e or --extra-vars for the tailscale exit node ip, usually 100.64.160.31
- name: Setup Local Router
  hosts: pfsense
  gather_facts: false
  vars:
    k8s_private_ingress_lb_ip: 172.31.0.110
    k8s_public_ingress_lb_ip: 172.31.0.109
    azure_dns_forwarder_ip: 10.0.1.132
    private_application_hosts:
      - alertmanager
      - grafana
      - immich
      - longhorn
      - prowlarr
      - qbittorrent
      - radarr
      - sonarr
      - vikunja
    public_application_hosts: 
      - emby
      - schedule
    azure_dns_domain_overrides:
      - privatelink.vaultcore.azure.net 
      - cloudapp.net
      - vault.azure.net
      - sutliffaro.com
    static_addresses:
      k8s-controlplane:
        macaddr: f4:8e:38:82:a9:dc
        ipaddr: 172.31.0.4
      k8s-node01:
        macaddr: 78:2b:cb:8c:aa:dc
        ipaddr: 172.31.0.10
      k8s-node02:
        macaddr: 0e:54:53:7c:a2:1f
        ipaddr: 172.31.0.40
      truenas:
        macaddr: 74:56:3c:35:37:cc
        ipaddr: 172.31.0.15
      deco-xe75:
        macaddr: f0:a7:31:69:7b:4d
        ipaddr: 172.31.0.75
      proxmox:
        macaddr: ac:1f:6b:00:5d:10
        ipaddr: 172.31.0.200
    # Internal-only bridge (vmbr2, no physical NIC - see Terraform/Proxmox/network.tf)
    # for a direct Talos <-> pfSense path that bypasses the physical LAN.
    # MACs are fixed in Terraform (Modules/Talos/main.tf's internal_mac var),
    # so these reservations can be written ahead of a live apply.
    internal_bridge_addresses:
      talos-controlplane0:
        macaddr: "02:00:00:99:01:00"
        ipaddr: 10.99.0.10
      talos-worker0:
        macaddr: "02:00:00:99:01:01"
        ipaddr: 10.99.0.11
      talos-worker1:
        macaddr: "02:00:00:99:01:02"
        ipaddr: 10.99.0.12
      talos-worker2:
        macaddr: "02:00:00:99:01:03"
        ipaddr: 10.99.0.13
  tasks:
    - name: set wan interface
      pfsensible.core.pfsense_interface:
        interface: ixl1
        descr: WAN
        enable: true
        ipv4_type: dhcp
        #ipv6_type: dhcp6
        blockpriv: true
        blockbogons: true
    - name: set lan interface
      pfsensible.core.pfsense_interface:
        interface: ixl0
        descr: LAN
        enable: true
        ipv4_type: static
        ipv4_address: 172.31.0.1
        ipv4_prefixlen: 17
    # Device name confirmed as vtnet2 via the pfSense console (Interfaces >
    # Assign - VirtIO Networking Adapter on virtio_pci5).
    - name: set internal bridge interface
      pfsensible.core.pfsense_interface:
        interface: vtnet2
        descr: INTERNAL
        enable: true
        ipv4_type: static
        ipv4_address: 10.99.0.1
        ipv4_prefixlen: 24
    - name: set general settings
      pfsensible.core.pfsense_setup:
        dns_addresses: 1.1.1.1 8.8.8.8 #why is this not a list? dunno
        dnsallowoverride: true
        timezone: US/Eastern
        language: en_US
    #-name: configure DHCP Server #Unavailable currently
    # IMPORTANT: no `name:` here. pfsense_dhcp_static's idempotency check
    # (_find_target()) matches existing staticmap entries on cid+mac when
    # `name` is given (name -> cid, a separate field from hostname - *not*
    # an alias for it), or on mac alone when name is omitted. Our existing
    # reservations have hostname set but no cid, so passing `name:` here
    # made every run fail to recognize them as already existing and add a
    # fresh duplicate instead - which is exactly what took down Kea DHCP
    # cluster-wide (it refuses to start with a duplicate MAC reservation).
    # Matching on macaddr alone is what actually finds the existing entries.
    - name: configure static DHCP leases
      pfsensible.core.pfsense_dhcp_static:
        netif: lan
        macaddr: "{{ item.value.macaddr }}"
        hostname: "{{ item.key }}"
        ipaddr: "{{ item.value.ipaddr }}"
      loop: "{{ lookup('dict', static_addresses) }}"
    # No DHCP scope/reservations needed on INTERNAL - the Talos nodes get
    # static addresses directly via machine config instead (Terraform/Proxmox/talos.tf's
    # local.internal_network), so this link doesn't depend on pfSense's DHCP
    # server at all. internal_bridge_addresses above stays just as a reference
    # of the hostname/MAC/IP mapping, matching what Terraform assigns.
    # The generic ansible.builtin.package correctly detects pfSense's package
    # manager as pkgng (FreeBSD) but has no action plugin registered to
    # actually dispatch to it - same class of issue as opkg needing an
    # explicit community.general.opkg reference elsewhere in this playbook.
    - name: install packages
      community.general.pkgng:
        name: "{{ item }}"
        state: present
      loop:
        - pfSense-pkg-sudo #needed for modules to run as root
        - tailscale
        #- pfblockerng-devel
        # - tftpd
    #- name: setup tailscale
    # pfsense_dns_resolver treats the whole <unbound> config as one object -
    # every call rebuilds it entirely from that call's own params, with any
    # field not passed falling back to the module's default (hosts: [],
    # forwarding: false, etc). Separate calls for general settings, hosts,
    # and domainoverrides each blindly wiped out what the previous call had
    # just set (dnssec/forwarding getting reset, then hosts getting reset) -
    # this is also why the hosts list needs one accumulated call instead of
    # one call per item (still an open upstream bug with no released fix,
    # pfsensible/core#153). The fix is structural on both axes: build each
    # complete desired list once, and make a single call with every field
    # that matters set together.
    - name: reset accumulated dns host overrides
      set_fact:
        all_dns_host_overrides: []
    - name: accumulate dns host overrides (static leases)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item.key, 'ip': item.value.ipaddr}] }}"
      loop: "{{ lookup('dict', static_addresses) }}"
    - name: accumulate dns host overrides (external facing applications)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item, 'ip': k8s_public_ingress_lb_ip}] }}"
      loop: "{{ public_application_hosts }}"
    - name: accumulate dns host overrides (internal facing applications)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item, 'ip': k8s_private_ingress_lb_ip}] }}"
      loop: "{{ private_application_hosts }}"
    - name: reset accumulated dns domain overrides
      set_fact:
        all_dns_domain_overrides: []
    - name: accumulate dns domain overrides (azure resources)
      set_fact:
        all_dns_domain_overrides: "{{ all_dns_domain_overrides + [{'domain': item, 'ip': azure_dns_forwarder_ip}] }}"
      loop: "{{ azure_dns_domain_overrides }}"
    - name: set dns resolver settings
      pfsensible.core.pfsense_dns_resolver:
        dnssec: true
        forwarding: true
        hosts: "{{ all_dns_host_overrides }}"
        domainoverrides: "{{ all_dns_domain_overrides }}"
    #- name: add ddns
    - name: add DNAT to public facing applications
      pfsensible.core.pfsense_nat_port_forward:
        descr: External to Public Ingress
        interface: wan
        protocol: tcp/udp
        source: any
        destination: IP:wan:443
        target: "{{ k8s_public_ingress_lb_ip }}:443"
        state: present
