
#at the end of this play, the router should

#have opnsense installed with 
#  items for PXE
#    PXE server installed
#    DHCP server installed
#    http server installed
#  items for tailscale
#    tailscale
#    advertise local routes over tailscale with correct CIDRS
#    act as an exit node
#    set default routes for local and remote LANs
#  items for firewall
#    port forwarding to the correct k8s load balancer ingresses
#
#IDS to be determined
# use -e or --extra-vars for the tailscale exit node ip, usually 100.64.160.31
- name: Setup Local Router
  hosts: pfsense
  gather_facts: false
  vars:
    k8s_private_ingress_lb_ip: 172.31.0.110
    k8s_public_ingress_lb_ip: 172.31.0.109
    azure_dns_forwarder_ip: 10.0.1.132
    private_application_hosts:
      - alertmanager
      - grafana
      - immich
      - longhorn
      - prowlarr
      - qbittorrent
      - radarr
      - sonarr
      - vikunja
    public_application_hosts: 
      - emby
      - schedule
    azure_dns_domain_overrides:
      - privatelink.vaultcore.azure.net 
      - cloudapp.net
      - vault.azure.net
      - sutliffaro.com
    static_addresses:
      k8s-controlplane:
        macaddr: f4:8e:38:82:a9:dc
        ipaddr: 172.31.0.4
      k8s-node01:
        macaddr: 78:2b:cb:8c:aa:dc
        ipaddr: 172.31.0.10
      k8s-node02:
        macaddr: 0e:54:53:7c:a2:1f
        ipaddr: 172.31.0.40
      truenas:
        macaddr: 74:56:3c:35:37:cc
        ipaddr: 172.31.0.15
      deco-xe75:
        macaddr: f0:a7:31:69:7b:4d
        ipaddr: 172.31.0.75
      proxmox:
        macaddr: ac:1f:6b:00:5d:10
        ipaddr: 172.31.0.200
    # Internal-only bridge (vmbr2, no physical NIC - see Terraform/Proxmox/network.tf)
    # for a direct Talos <-> pfSense path that bypasses the physical LAN.
    # MACs are fixed in Terraform (Modules/Talos/main.tf's internal_mac var),
    # so these reservations can be written ahead of a live apply.
    internal_bridge_addresses:
      talos-controlplane0:
        macaddr: "02:00:00:99:01:00"
        ipaddr: 10.99.0.10
      talos-worker0:
        macaddr: "02:00:00:99:01:01"
        ipaddr: 10.99.0.11
      talos-worker1:
        macaddr: "02:00:00:99:01:02"
        ipaddr: 10.99.0.12
      talos-worker2:
        macaddr: "02:00:00:99:01:03"
        ipaddr: 10.99.0.13
  tasks:
    - name: set wan interface
      pfsensible.core.pfsense_interface:
        interface: ixl1
        descr: WAN
        enable: true
        ipv4_type: dhcp
        #ipv6_type: dhcp6
        blockpriv: true
        blockbogons: true
    - name: set lan interface
      pfsensible.core.pfsense_interface:
        interface: ixl0
        descr: LAN
        enable: true
        ipv4_type: static
        ipv4_address: 172.31.0.1
        ipv4_prefixlen: 17
    # TODO: confirm the actual OS device name pfSense assigns the new NIC
    # (added via `qm set 100 --net2 virtio,bridge=vmbr2,...` on the Proxmox
    # host - see Terraform/Proxmox/network.tf) under Interfaces > Assignments
    # before running this - it's a virtio NIC, not passthrough, so it won't
    # be ixlN like WAN/LAN; likely vtnet2, but unconfirmed until it's visible.
    - name: set internal bridge interface
      pfsensible.core.pfsense_interface:
        interface: vtnet2 # TODO: confirm actual device name
        descr: INTERNAL
        enable: true
        ipv4_type: static
        ipv4_address: 10.99.0.1
        ipv4_prefixlen: 24
    - name: set general settings
      pfsensible.core.pfsense_setup:
        dns_addresses: 1.1.1.1 8.8.8.8 #why is this not a list? dunno
        dnsallowoverride: true
        timezone: US/Eastern
        language: en_US
    #-name: configure DHCP Server #Unavailable currently
    - name: configure static DHCP leases
      pfsensible.core.pfsense_dhcp_static:
        interface: lan
        name: "{{ item.key }}"
        macaddr: "{{ item.value.macaddr }}"
        hostname: "{{ item.key }}"
        ipaddr: "{{ item.value.ipaddr }}"
      loop: "{{ lookup('dict', static_addresses) }}"
    # Requires a DHCP scope to already be enabled on the INTERNAL interface
    # first (the "configure DHCP Server" step above is a manual, UI-only step
    # today per the note on that task - do that before running this).
    - name: configure static DHCP leases on the internal bridge
      pfsensible.core.pfsense_dhcp_static:
        interface: INTERNAL
        name: "{{ item.key }}"
        macaddr: "{{ item.value.macaddr }}"
        hostname: "{{ item.key }}"
        ipaddr: "{{ item.value.ipaddr }}"
      loop: "{{ lookup('dict', internal_bridge_addresses) }}"
    - name: install packages
      package:
        name: "{{ item }}"
        state: present
      loop:
        - pfSense-pkg-sudo #needed for modules to run as root
        - tailscale
        - pfblockerng
        - tftpd
    #- name: setup tailscale
    - name: dns resolver settings
      pfsensible.core.pfsense_dns_resolver:
        dnssec: true
        forwarding: true
    # pfsense_dns_resolver's `hosts`/`domainoverrides` are full-replace, not
    # additive - calling it once per item (the old loop-based tasks below)
    # meant each call wiped out whatever the previous call had just set,
    # leaving only the very last item actually live in pfSense. Still an open
    # upstream bug with no released fix (pfsensible/core#153), so the fix
    # here is structural: build the complete desired list once and make a
    # single call.
    - name: reset accumulated dns host overrides
      set_fact:
        all_dns_host_overrides: []
    - name: accumulate dns host overrides (static leases)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item.key, 'ip': item.value.ipaddr}] }}"
      loop: "{{ lookup('dict', static_addresses) }}"
    - name: accumulate dns host overrides (external facing applications)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item, 'ip': k8s_public_ingress_lb_ip}] }}"
      loop: "{{ public_application_hosts }}"
    - name: accumulate dns host overrides (internal facing applications)
      set_fact:
        all_dns_host_overrides: "{{ all_dns_host_overrides + [{'domain': 'andrewsutliff.com', 'host': item, 'ip': k8s_private_ingress_lb_ip}] }}"
      loop: "{{ private_application_hosts }}"
    - name: set all dns host overrides
      pfsensible.core.pfsense_dns_resolver:
        hosts: "{{ all_dns_host_overrides }}"
    - name: reset accumulated dns domain overrides
      set_fact:
        all_dns_domain_overrides: []
    - name: accumulate dns domain overrides (azure resources)
      set_fact:
        all_dns_domain_overrides: "{{ all_dns_domain_overrides + [{'domain': item, 'ip': azure_dns_forwarder_ip}] }}"
      loop: "{{ azure_dns_domain_overrides }}"
    - name: set all dns domain overrides
      pfsensible.core.pfsense_dns_resolver:
        domainoverrides: "{{ all_dns_domain_overrides }}"
    #- name: add ddns
    - name: add DNAT to public facing applications
      pfsensible.core.pfsense_nat_port_forward:
        descr: External to Public Ingress
        interface: wan
        protocol: tcp/udp
        source: any
        destination: IP:wan:443
        target: "{{ k8s_public_ingress_lb_ip }}:443"
        state: present

- name: Setup Remote Router
  hosts: openwrt
  gather_facts: false
  tags: openwrt
  roles:
    - ansible-openwrt
    - role: ansible-openwrt
      vars:
        openwrt_scp_if_ssh: yes
        openwrt_install_recommended_packages: yes
        scp_if_ssh: yes
  vars:
    main_router_tailscale_ip: 100.107.68.105
  tasks:
    - name: change default lan interface ip
      uci:
        command: section
        config: network
        name: lan
        type: interface
        find_by:
          device: br-lan
        value:
          proto: static
          device: br-lan
          ipaddr: 172.31.128.1/17
          netmask: 225.225.128.0
          ip6assign: 60
    - name: install serial exposure module
      opkg:
        name: kmod-usb-serial-option
    - name: install uqmi requirements
      opkg:
        name: "{{ item }}"
        state: present
      loop:
        - kmod-usb-net-qmi-wwan
        - uqmi
        - luci-proto-qmi
    - name: set wwan interface
      uci:
        command: section
        config: network
        name: wwan
        type: interface
        find_by:
          device: /dev/cdc-wdm0
        value:
          proto: qmi
          device: /dev/cdc-wdm0
          apn: internet
          pdptype: ipv4v6
    - name: check if wwan is running
      shell:
        cmd: uqmi -d /dev/cdc-wdm0 --get-data-status
      register: connection_status
    - name: start wwan card
      shell:
        cmd: uqmi -d /dev/cdc-wdm0 --start-network internet --autoconnect
      when: connection_status.stdout != "\"connected\""
    - name: commit changes
      uci:
        command: commit
      notify: restart network
    - name: install tailscale
      opkg:
        name: tailscale
        state: present
    - name: init tailscale
      shell:
        cmd: "tailscale up --advertise-routes=172.31.128.0/17 --accept-routes --exit-node={{ main_router_tailscale_ip }} --exit-node-allow-lan-access=true --netfilter-mode=off --snat-subnet-routes=true --auth-key={{ tailscale_auth_key }}"
      tags: tailscale_init
    - name: add tailscale interface
      uci:
        command: section
        config: network
        name: tailscale
        type: interface
        find_by:
          device: tailscale0
        value:
          proto: none
          device: tailscale0
    - name: setup tailscale firewall zone 
      uci:
        #command: add
        command: set
        key: firewall.@zone[-1]
        #config: firewall
        #type: zone
        value:
          name: tailscale
          input: ACCEPT
          output: ACCEPT
          forward: ACCEPT
          masq: 1
          mtu_fix: 1
          enabled: 1
    - name: add list network to tailscale zone
      uci:
        command: add_list
        key: firewall.@zone[-1].network
        value: tailscale
    - name: forward tailscale to lan
      uci:
        command: set
        key: firewall.@forwarding[0]
        value:
          src: tailscale
          dest: lan
    - name: forward lan to tailscale
      uci:
        command: set
        key: firewall.@forwarding[1]
        value:
          src: lan
          dest: tailscale
    - name: forward tailscale to wan
      uci:
        command: set
        key: firewall.@forwarding[2]
        value:
          src: tailscale
          dest: wan
    - name: delete old dns forwarding servers
      uci:
        command: delete
        key: network.wan.dns
    - name: set new dns upstream forwarding
      uci:
        command: add_list
        key: network.wan.dns
        value: "{{ item }}"
      loop:
        - 172.31.0.1
        - 100.100.100.100
    - name: turn off peer dns
      uci:
        command: set
        key: "{{ item }}"
        value: "0"
      loop:
        - network.wan.peerdns
          #- network.wan6.peerdns don't have DNS set up on ipv6 yet
    - name: Force DNS Through Router
      uci:
        command: set
        key: firewall.@redirect[-1]
        value:
          target: DNAT
          name: 'Force DNS'
          src: lan
          src_dport: 53
    - name: commit changes
      uci:
        command: commit
      notify: restart network
