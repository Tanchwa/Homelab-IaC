apiVersion: v1
kind: PersistentVolume
metadata:
  name: gittea-nfs
  labels:
    type: nfs
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # See Manifests/Immich/library-pvc.yaml for why this is csi: instead of
  # nfs: - same csi-driver-nfs migration, same reasoning.
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "172.31.0.15/mnt/Main/kubernetes/Gittea##"
    volumeAttributes:
      server: "172.31.0.15"
      share: "/mnt/Main/kubernetes/Gittea"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gittea-nfs
  namespace: gittea
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
