apiVersion: batch/v1
kind: CronJob
metadata:
  creationTimestamp: null
  name: rfc-sync
  namespace: default
spec:
  jobTemplate:
    metadata:
      creationTimestamp: null
      name: rfc-sync
    spec:
      template:
        metadata:
          creationTimestamp: null
        spec:
          volumes:
            # Inline/ephemeral CSI volume - no PV/PVC needed, same as the old
            # in-tree nfs: volume this replaces. Requires the csi-driver-nfs
            # Application (Applications/CSI-NFS/csi-driver-nfs.yaml), whose
            # CSIDriver object declares the Ephemeral lifecycle mode.
            - csi:
                driver: nfs.csi.k8s.io
                volumeAttributes:
                  server: "172.31.0.15"
                  share: "/mnt/Main/kubernetes"
              name: rfc-sync-vol
          containers:
          - command:
            - rsync
            - -avz
            - --delete
            - rsync.rfc-editor.org::rfcs-text-only 
            - nfs-share/rfc-mirror
            image: ghcr.io/servercontainers/rsync:a3.20.3-r3.3.0
            name: rfc-sync
            resources: {}
            volumeMounts: 
            - name: rfc-sync-vol
              mountPath: /nfs-share
          restartPolicy: OnFailure
  schedule: 0 0 1 * *
status: {}
