apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs
  labels:
    type: nfs
spec:
  storageClassName: manual
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "172.31.0.15/mnt/Main/kubernetes/Immich##"
    volumeAttributes:
      server: "172.31.0.15"
      share: "/mnt/Main/kubernetes/Immich"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nfs
  namespace: immich
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
